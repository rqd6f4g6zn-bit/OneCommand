# Image smoke run: 32×32, small U-Net, CPU ~5 min. Proves data, model, noise schedule and sampler.
run: smoke
kind: image
data_dir: data/processed
seed: 42
size: 32
model: {base: 32, mults: [1, 2], attention: false, dropout: 0.0}
diffusion: {timesteps: 1000, sample_steps: 50}
train: {steps: 1500, batch_size: 16, lr: 0.001, warmup: 100, ema: 0.995, samples: 16}
