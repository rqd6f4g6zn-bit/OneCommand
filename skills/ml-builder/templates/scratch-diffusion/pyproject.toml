[project]
name = "scratch-diffusion"
version = "0.1.0"
description = "Own image / video generator (diffusion model) trained from scratch on own data (OneCommand template)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pillow>=10",
  "safetensors>=0.4",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scratch_diffusion"]

# CPU wheels by default; blocked host → `uv sync --no-sources`; GPU → the CUDA index of your driver.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
