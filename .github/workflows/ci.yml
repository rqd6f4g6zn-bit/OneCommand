name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, python, json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck -S warning install.sh hooks/*.sh
      - name: Python compiles
        run: python -m py_compile hooks/*.py tests/*.py
      - name: JSON is valid
        run: |
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json hooks/hooks.json; do
            python -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs install.sh and quality-gate.sh with the system bash 3.2.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: rsync (macOS ships openrsync)
        if: runner.os == 'macOS'
        run: brew install rsync
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests -v --durations=10

  e2e:
    name: Gate end to end (Prisma + SQLite + Playwright)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright system dependencies
        run: npx -y playwright@1.56.1 install-deps chromium
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run end-to-end gate tests
        env:
          ONECOMMAND_E2E_TESTS: "1"
        run: python -m pytest tests/test_gate_e2e.py -v
